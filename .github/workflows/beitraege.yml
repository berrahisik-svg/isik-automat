name: Beitraege posten

on:
  schedule:
    - cron: "40 13 * * *"        # 14:40 Winterzeit / 15:40 Sommerzeit - gegen 15 Uhr
  workflow_dispatch:             # Knopf zum Selberstarten
    inputs:
      typ:
        description: "feed = geplanter Beitrag mit Text | feedfoto = nur Bild, frisch aus Drive"
        required: false
        default: "feed"
        type: choice
        options:
          - feed
          - feedfoto

concurrency: posten

permissions:
  contents: write
  issues: write

jobs:
  feed:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        kunde: [prime-doener]     # DönerFabriq steht hier bewusst NICHT drin:
                                  # dort werden nur Stories gepostet.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python skripte/run.py --kunde ${{ matrix.kunde }} --typ ${{ inputs.typ || 'feed' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_DIENSTKONTO: ${{ secrets.GOOGLE_DIENSTKONTO }}
          IG_TOKEN_PRIMEDOENER: ${{ secrets.IG_TOKEN_PRIMEDOENER }}
          IG_ACCOUNT_PRIMEDOENER: ${{ secrets.IG_ACCOUNT_PRIMEDOENER }}
