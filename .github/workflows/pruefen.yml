name: Zugang pruefen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Instagram DoenerFabriq
        env:
          IG_TOKEN_DOENERFABRIQ: ${{ secrets.IG_TOKEN_DOENERFABRIQ }}
          IG_ACCOUNT_DOENERFABRIQ: ${{ secrets.IG_ACCOUNT_DOENERFABRIQ }}
        run: |
          python -c "
          import os, sys; sys.path.insert(0, 'skripte')
          import post
          t = os.environ.get('IG_TOKEN_DOENERFABRIQ'); a = os.environ.get('IG_ACCOUNT_DOENERFABRIQ')
          if not t or not a:
              print('DoenerFabriq: Secrets fehlen'); raise SystemExit(1)
          print('Instagram verbunden:', post.pruefe_token(a, t))
          "

      - name: Instagram PrimeDoener
        if: always()
        env:
          IG_TOKEN_PRIMEDOENER: ${{ secrets.IG_TOKEN_PRIMEDOENER }}
          IG_ACCOUNT_PRIMEDOENER: ${{ secrets.IG_ACCOUNT_PRIMEDOENER }}
        run: |
          python -c "
          import os, sys; sys.path.insert(0, 'skripte')
          import post
          t = os.environ.get('IG_TOKEN_PRIMEDOENER'); a = os.environ.get('IG_ACCOUNT_PRIMEDOENER')
          if not t or not a:
              print('PrimeDoener: Secrets fehlen'); raise SystemExit(1)
          print('Instagram verbunden:', post.pruefe_token(a, t))
          "

      - name: Google Drive
        if: always()
        env:
          GOOGLE_DIENSTKONTO: ${{ secrets.GOOGLE_DIENSTKONTO }}
        run: |
          python -c "
          import json, sys; sys.path.insert(0, 'skripte')
          import drive, render
          m = render.lade_marke('doenerfabriq')
          f = drive.fotos(m['drive_ordner'])
          print('Fotos in Drive:', len(f))
          for x in f[:5]:
              print('  ', x['name'])
          if not f:
              raise SystemExit('Keine Bilder gefunden - Ordner freigegeben?')
          "

      - name: Story automatisch bauen
        if: always()
        env:
          GOOGLE_DIENSTKONTO: ${{ secrets.GOOGLE_DIENSTKONTO }}
        run: python skripte/run.py --kunde doenerfabriq --typ story --trocken

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: veroeffentlicht/**
