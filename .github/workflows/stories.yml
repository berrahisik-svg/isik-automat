name: Stories posten

on:
  schedule:
    - cron: "17 9 * * *"         # 10:17 Winterzeit / 11:17 Sommerzeit - immer im Fenster 10:00-11:30
  workflow_dispatch:             # Knopf zum Selberstarten
    inputs:
      kunde:
        description: "Nur fuer diesen Kunden posten (leer = alle)"
        required: false
        default: ""

concurrency: posten               # nie zwei Laeufe gleichzeitig

permissions:
  contents: write                 # darf das gepostete Bild ins Repo schreiben
  issues: write                   # darf die Nachschub-Erinnerung anlegen

jobs:
  story:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        kunde: [prime-doener]     # DoenerFabriq ist vorerst rausgenommen (17.11.2026)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - if: ${{ inputs.kunde == '' || inputs.kunde == matrix.kunde }}
        run: python skripte/run.py --kunde ${{ matrix.kunde }} --typ story
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_DIENSTKONTO: ${{ secrets.GOOGLE_DIENSTKONTO }}
          IG_TOKEN_PRIMEDOENER: ${{ secrets.IG_TOKEN_PRIMEDOENER }}
          IG_ACCOUNT_PRIMEDOENER: ${{ secrets.IG_ACCOUNT_PRIMEDOENER }}
